                  - reportId: 424ad55c-36cc-4077-b85e-c22ea984cc4a
                    fapiInteractionId: d78fc4e5-37ca-4da3-adf2-9b082bf92280
                    endpoint: /credit-operations/{contractId}/portability-eligibility
                    httpMethod: POST
                    statusCode: 200
                    timestamp: '2021-11-11T18:08:08.894Z'
                    processTimespan: 120
                    clientOrgId: c3779651-c918-48b1-b1fb-e36ba76cb036
                    serverOrgId: 5ec47c83-9010-4540-91ad-b820ef0df04a
                    role: SERVER
                    status: PENDING
                    statusUpdateDateTime: '2020-07-21T08:30:00Z'
                    rejectionReason: CANCELED
                    rejectedBy: CREDORA
                summary: Request Valido
                description: O request apresentado tem todos os campos validados.
      responses:
        '200':
          description: "\t\nO status 200 representa a situação onde todos os registros enviados no lote foram validados e serão direcionados para processamento. Se pelo menos 1 registro contiver problemas de validação, o retorno será 207 (veja descrição do status).\n\nA operação vai devolver um array com todos os resultados, e garante que ele esteja na mesma ordem do array da requisição."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportResponse'
              examples:
                '1':
                  summary: Sucesso
                  value:
                    reportId: 424ad55c-36cc-4077-b85e-c22ea984cc4a
                    correlationId: 424ad55c-36cc-4077-b85e-c22ea984cc4a
                    status: ACCEPTED
                '2':
                  summary: Sucesso
                  value:
                    reportId: 424ad55c-36cc-4077-b85e-c22ea984cc4a
                    correlationId: 424ad55c-36cc-4077-b85e-c22ea984cc4a
                    status: ACCEPTED
                '3':
                  summary: Sucesso
                  value:
                    reportId: 424ad55c-36cc-4077-b85e-c22ea984cc4a
                    correlationId: 424ad55c-36cc-4077-b85e-c22ea984cc4a
                    status: ACCEPTED
          headers: {}
        '207':
          description: >-
            O status 207 (Multi-Status) informa ao solicitante que o formato da
            requisição está correto, mas que entradas do array contém erro de
            validação em pelo menos 1 item. Ou seja, se todos os elementos do
            array informado estiverem com falha de validação, a operação vai
            devolver o status 207, e no corpo da resposta todos os elementos do
            array vão estar com status DISCARDED e com sua respectiva mensagem.


            A operação vai devolver um array com todos os resultados, e garante
            que ele esteja na mesma ordem do array da requisição.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportResponse'
              examples:
                '4':
                  summary: Primeiro registro com falha
                  value:
                    - reportId: 424ad55c-36cc-4077-b85e-c22ea984cc4a
                      correlationId: 424ad55c-36cc-4077-b85e-c22ea984cc4a
                      status: DISCARDED
                      message: fapiInteractionId must be a UUID
                    - reportId: 424ad55c-36cc-4077-b85e-c22ea984cc4a
                      correlationId: 424ad55c-36cc-4077-b85e-c22ea984cc4a
                      status: ACCEPTED
                    - reportId: 424ad55c-36cc-4077-b85e-c22ea984cc4a
                      correlationId: 424ad55c-36cc-4077-b85e-c22ea984cc4a
                      status: ACCEPTED
                '5':
                  summary: Todos os registros com falha
                  value: "[\r\n  {\r\n    \"reportId\": \"424ad55c-36cc-4077-b85e-c22ea984cc4a\",\r\n    \"correlationId\": \"wNupARo7I9E2PLJZph18a0M9y7DcUe7ITt3DqUOJd9NVjnskxf\",\r\n    \"status\": \"DISCARDED\",\r\n    \"message\": \"Missing fields: 'fapiInteractionId'\"\r\n  },\r\n  {\r\n    \"reportId\": \"424ad55c-36cc-4077-b85e-c22ea984cc4b\",\r\n    \"correlationId\": \"wNupARo7I9E2PLJZph18a0M9y7DcUe7ITt3DqUOJd9NVjnskxf\",\r\n    \"status\": \"DISCARDED\",\r\n    \"message\": \"Missing fields: 'fapiInteractionId'\"\r\n  },\r\n  {\r\n    \"reportId\": \"424ad55c-36cc-4077-b85e-c22ea984cc4c\",\r\n    \"correlationId\": \"wNupARo7I9E2PLJZph18a0M9y7DcUe7ITt3DqUOJd9NVjnskxf\",\r\n    \"status\": \"DISCARDED\",\r\n    \"message\": \"Missing fields: 'fapiInteractionId'\"\r\n  },\r\n]"
                '6':
                  summary: Campo obrigatório não enviado
                  value:
                    - reportId: 424ad55c-36cc-4077-b85e-c22ea984cc4a,
                      correlationId: wNupARo7I9E2PLJZph18a0M9y7DcUe7ITt3DqUOJd9NVjnskxf,
                      status: DISCARDED,
                      message: 'Missing fields: ''statusCode'''
          headers: {}
        '400':
          description: O formato do corpo da requisição não é um array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
              example:
                message: 'Invalid payload format: MUST be an array'
          headers: {}
        '401':
          description: >-
            Ocorre quando uma requisição não é autorizada pelo gateway, e
            acontece quando o token não é enviado ou está inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
              example:
                message: Unauthorized
          headers: {}
        '403':
          description: >-
            Ocorre quando um cliente já previamente identificado (autenticado)
            não é autorizado a acessar um determinado recurso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
              example:
                message: Forbidden
          headers: {}
        '406':
          description: >-
            Ocorre quando um cliente espera uma resposta diferente de
            application/json usando o header Accept
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
              example:
                message: Content type not accepted
          headers: {}
        '413':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
              example:
                message: Record limit exceeded
          headers: {}
        '415':
          description: >-
            Ocorre quando uma requisição envia um Content Type diferente de
            application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
              example:
                message: Unsupported Media Type
          headers: {}
        '429':
          description: >-
            Ocorre quando o servidor atinge o limite de requisições (atualmente,
            300 req/s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
              example:
                message: Too Many Requests
          headers: {}
        '500':
          description: É devolvido quando ocorre um erro não identificado no servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
              example:
                message: Internal Server Error
          headers: {}
      security:
        - bearer: []
  /report-api/v1/credit-portabilities/d78fc4e5-37ca-4da3-adf2-9b082bf92285:
    get:
      summary: Consulta de um report de credit portability
      deprecated: false
      description: ''
      tags: []
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  reportId:
                    type: string
                    format: uuid
                    maxLength: 36
                    pattern: >-
                      ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    description: >-
                      Identificador único do registro criado na Plataforma de
                      Coleta de Métricas.
                  pairedReportId:
                    type: string
                    format: uuid
                    maxLength: 36
                    pattern: >-
                      pattern:
                      ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    description: >-
                      Esse atributo indica o reportId do registro que forma uma
                      correlação com o presente registro. Se essa informação
                      existir, o status do registro atual deverá ser PAIRED
                  creditPortabilityStatus:
                    type: string
                    description: >-
                      Informação sobre o status de um pedido de portabilidade de
                      crédito, onde:


                      RECEIVED: Estado inicial. Indica que o pedido de
                      portabilidade foi solicitado junto à instituição credora.
                      O pedido deve permanecer neste estado até o próximo dia
                      útil (D+1) onde começará a contar o prazo de 3 dias úteis
                      para a etapa de contraproposta e o pedido de portabilidade
                      deverá ser movido para PENDING

                      PENDING: Indica que o pedido de portabilidade de crédito
                      está na fase de contraproposta, onde a instituição credora
                      poderá enviar uma contraproposta ou não para o cliente por
                      qualquer canal (email, telefone, etc.) porém o aceite só
                      deverá ser valido se o cliente aprovar no canal digital da
                      instituição credora

                      ACCEPTED_SETTLEMENT_IN_PROGRESS: Indica que a
                      contraproposta não foi aceita pelo cliente e a instituição
                      proponente terá que quitar o valor do contrato no mesmo
                      dia em que o estado foi ativado.

                      ACCEPTED_SETTLEMENT_COMPLETED: Indica que a instituição
                      proponente já liquidou o contrato e comunicou a respeito à
                      credora que está validando os dados do contrato bem como
                      valores recebidos para a quitação do mesmo (nesta etapa a
                      instituição credora tem 2 dias úteis para fornecer a
                      confirmação e o recibo de quitação do contrato de
                      empréstimo)

                      PORTABILITY_COMPLETED: Indica que o pedido de
                      portabilidade foi concluído com sucesso REJECTED: Indica
                      que o pedido de portabilidade de crédito foi rejeitado,
                      seja porque o cliente aceitou a contraproposta, ou porque
                      a proponente rejeitou a liquidação que excedeu em 15% o
                      valor do contrato original, entre outras possibilidades

                      CANCELLED: Indica que o cliente cancelou o pedido de
                      portabilidade de crédito

                      PAYMENT_ISSUE: Indica que a Instituição Credora encontrou
                      alguma inconsistência na liquidação efetuada e que a
                      Instituição Proponente deverá realizar ajustes conforme
                      sugerido pela Instituição Credora para solucionar a
                      pendência antes do cancelamento do pedido de portabilidade
                      de crédito
                    enum:
                      - PENDING
                      - RECEIVED
                      - ACCEPTED_SETTLEMENT_IN_PROGRESS
                      - ACCEPTED_SETTLEMENT_COMPLETED
                      - PORTABILITY_COMPLETED
                      - REJECTED
                      - CANCELLED
                    example: RECEIVED
                  createdAt:
                    type: string
                    format: date-time
                    maxLength: 28
                    description: Carimbo do tempo do momento da criação do registro
                  updatedAt:
                    type: string
                    format: date-time
                    maxLength: 28
                    description: >-
                      Carimbo do tempo do momento da última atualização do
                      registro
                  status:
                    type: string
                    description: >-
                      Informa o status do registro de reporte.


                      DISCARDED: O status DISCARDED indica que o reporte enviado
                      pelo participante foi rejeitado pela PCM. O motivo do
                      descarte será enviado com a resposta, podendo ser por
                      conta de um reporte inválido ou por um erro no
                      processamento. Não é possível modificar um reporte
                      DISCARDED, portanto o reportador deverá corrigir o
                      registro que apresentou erro e reenviar via POST.

                      SINGLE: O status SINGLE indica que o reporte em questão
                      não tem uma contraparte. Ele é utilizado em casos onde a
                      conciliação entre dois reportes não é possível.

                      ACCEPTED: O status ACCEPTED indica que a validação de
                      formato do reporte não tem erros e este será enviado para
                      processamento.

                      UNPAIRED: O status UNPAIRED significa que o reporte atual
                      não possui uma correspondência em outro reporte através do
                      atributo fapiInteractionId. Indica um reporte divergente.

                      PAIRED_INCONSISTENT: O status PAIRED_INCONSISTENT
                      significa que o reporte corrente possui uma contraparte
                      com o mesmo fapiInteractionId, mas os demais dados estão
                      inconsistentes. Indica um reporte divergente.

                      PAIRED: Indica que o reporte tem uma contraparte com o
                      mesmo fapiInteractionId e os demais dados estão
                      conciliados. Representa o estado final desejado em um
                      fluxo correto.
          headers: {}
        '401':
          $ref: '#/components/responses/Default401Error'
          description: ''
        '403':
          $ref: '#/components/responses/Default403Error'
          description: ''
        '404':
          $ref: '#/components/responses/Record not found'
          description: ''
        '406':
          $ref: '#/components/responses/Default406Error'
          description: ''
        '429':
          $ref: '#/components/responses/Default429Error'
          description: ''
        '500':
          $ref: '#/components/responses/Default500Error'
          description: ''
      security:
        - bearer: []
