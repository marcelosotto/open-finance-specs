        código de erro. Ao enviar um report, a Plataforma vai fazer o processo
        de validação de maneira síncrona e devolver o resultado dessa validação
        na resposta. O status HTTP de retorno será 200 caso o reporte enviado
        seja aceito.
      operationId: add-reports-redirect-with-errors
      tags:
