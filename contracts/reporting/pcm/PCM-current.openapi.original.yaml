          description: Código identificador do pedido de portabilidade realizado.
          pattern: >-
            ^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$
          maxLength: 100
          example: urn:bancoex:C1DD33123
        statusUpdateDateTime:
          type: string
          description: >-
            Data e hora em que o contrato teve o status atualizado. Uma string
            com data e hora conforme especificação ISO-8601, sempre com a
            utilização de timezone UTC(UTC time format).
          pattern: >-
            ^\d{4}-\d{2}-\d{2}T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|[+-][01]\d:[0-5]\d)$
          example: '2020-07-21T08:30:00Z'
        processTimespan:
          type: number
          description: >-
            Tempo em milissegundos inteiros decorrido desde o registro do
            timestamp até a chegada do primeiro byte da resposta do server.
          example: 120.000001
        rejectionReason:
          type: string
          description: >-
            Motivo de recusa do pedido de portabilidade.


            Só será preenchido caso o status seja REJECTED, CANCELLED ou
            PAYMENT_ISSUE

            A consulta ao endpoint de GET é requerida para o fluxo de
            portabilidade
          example: CANCELADO_PELO_CLIENTE
        rejectedBy:
          type: string
          description: >-
            Informar usuário responsável pela rejeição da proposta, onde:
            PROPONENTE - Indica que o pedido de portabilidade de crédito foi
            rejeitado pela proponente, seja porque a proponente rejeitou a
            liquidação que excedeu em 15% o valor do contrato original, entre
            outras possibilidades. USUARIO - Indica que o cliente cancelou o
            pedido de portabilidade de crédito. CREDORA- Indica que a
            Instituição Credora cancelou o contrato por retenção do cliente ou
            outros motivos conforme motivo de recusa.


            Só será preenchido caso o status seja REJECTED ou CANCELLED
          enum:
            - PROPONENTE
            - USUARIO
            - CREDORA
          example: CREDORA
        creditPortabilityStatus:
          type: string
          description: >-
            Informação sobre o status de um pedido de portabilidade de crédito,
            onde:


            RECEIVED: Estado inicial. Indica que o pedido de portabilidade foi
            solicitado junto à instituição credora. O pedido deve permanecer
            neste estado até o próximo dia útil (D+1) onde começará a contar o
            prazo de 3 dias úteis para a etapa de contraproposta e o pedido de
            portabilidade deverá ser movido para PENDING

            PENDING: Indica que o pedido de portabilidade de crédito está na
            fase de contraproposta, onde a instituição credora poderá enviar uma
            contraproposta ou não para o cliente por qualquer canal (email,
            telefone, etc.) porém o aceite só deverá ser valido se o cliente
            aprovar no canal digital da instituição credora

            ACCEPTED_SETTLEMENT_IN_PROGRESS: Indica que a contraproposta não foi
            aceita pelo cliente e a instituição proponente terá que quitar o
            valor do contrato no mesmo dia em que o estado foi ativado.

            ACCEPTED_SETTLEMENT_COMPLETED: Indica que a instituição proponente
            já liquidou o contrato e comunicou a respeito à credora que está
            validando os dados do contrato bem como valores recebidos para a
            quitação do mesmo (nesta etapa a instituição credora tem 2 dias
            úteis para fornecer a confirmação e o recibo de quitação do contrato
            de empréstimo)

            PORTABILITY_COMPLETED: Indica que o pedido de portabilidade foi
            concluído com sucesso REJECTED: Indica que o pedido de portabilidade
            de crédito foi rejeitado, seja porque o cliente aceitou a
            contraproposta, ou porque a proponente rejeitou a liquidação que
            excedeu em 15% o valor do contrato original, entre outras
            possibilidades

            CANCELLED: Indica que o cliente cancelou o pedido de portabilidade
            de crédito

            PAYMENT_ISSUE: Indica que a Instituição Credora encontrou alguma
            inconsistência na liquidação efetuada e que a Instituição Proponente
            deverá realizar ajustes conforme sugerido pela Instituição Credora
            para solucionar a pendência antes do cancelamento do pedido de
            portabilidade de crédito
          enum:
            - RECEIVED
            - PENDING
            - ACCEPTED_SETTLEMENT_IN_PROGRESS
            - ACCEPTED_SETTLEMENT_COMPLETED
            - PORTABILITY_COMPLETED
            - REJECTED
            - CANCELLED
            - PAYMENT_ISSUE
          example: RECEIVED
        errorCode:
          type: string
          description: Código de erro.
      required:
        - fapiInteractionId
        - endpoint
        - statusCode
        - httpMethod
        - timestamp
        - clientOrgId
        - serverOrgId
