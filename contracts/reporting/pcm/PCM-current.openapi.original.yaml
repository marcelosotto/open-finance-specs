            description: Identifica a plataforma utilizada
            example: BROWSER
          osVersion:
            type: string
            description: Versão do Sistema Operacional utilizado
            example: '20.04'
          os:
            type: string
            description: Sistema Operacional utilizado
            enum:
              - LINUX
              - MACOS
              - UNIX
              - IOS
              - ANDROID
              - OTHER
              - WINDOWS
            example: LINUX
          error:
            type: string
            description: Código de erro retornado no payload do Hybrid Flow
            example: Código de erro retornado no payload do Hybrid Flow
          timestamp:
            type: string
            description: >-
              Data/Hora UTC no formato ISO8601 com milissegundos
              (YYYY-MM-DDTHH:mm:ss.sssZ) do momento em que a chamada foi
              disparada, imediatamente antes do primeiro byte enviado na
              requisição.
            maxLength: 28
            format: date-time
            pattern: >-
              ^\d{4}-\d{2}-\d{2}T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|[+-][01]\d:[0-5]\d)$
            example: '2021-11-11T18:08:08.278Z'
          clientOrgId:
            description: >-
              A ser enviado vazio caso o report seja da mesma instituição que
              obteve o token para uso da PCM e, caso contrário, deve ser
              preenchido com o organasationId da instituição filha para o qual a
              instituição mãe está fazendo o report.
            type: string
            format: uuid
            maxLength: 36
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            example: 56411f7e-d58b-44a8-8a2b-ff326d3f2955
    HybridFlowServerRedirectToClientRequest:
      description: ''
      type: array
      minItems: 0
      maxItems: 1000
      items:
        type: object
        required:
          - consentId
          - uri_callback
          - platform
          - osVersion
          - os
          - type
          - timestamp
          - serverOrgId
        properties:
          consentId:
            type: string
            pattern: >-
              ^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$
            maxLength: 256
            description: >-
              O consentId deve ser preenchido com a mesma string do
              identificador único de um fluxo de consentimento de dados, de
              pagamento ou de vínculo


              exemplos:


              pós POST /open-banking/payments/v4/consents utilizar a string
              obtida/enviada em data.consentId


              pós POST /open-banking/consents/v3/consents utilizar a string
              obtida/enviada em data.consentId


              pós POST /automatic-payments/v1/recurring-consents utilizar a
              string obtida/enviada em data.recurringConsentId


              pós POST /automatic-payments/v1/pix/recurring-payments utilizar a
              string obtida/enviada em data.recurringConsentId


              pós POST /open-banking/enrollments/v1/enrollments utilizar a
              string obtida/enviada em data.enrollmentId
            example: urn:bancoex:C1DD33123
          uri_callback:
            type: string
            pattern: ^[- /:_.',0-9a-zA-Z]{0,200}$
            maxLength: 200
            format: uri
            description: >-
              URI específico fornecido como endpoint de retorno de chamada.
              Preencher com a uri_callback registrada pelo sistema consumidor
              durante o DCR/DCM. Caso a URI tenha mais de 200 caracteres de
              extensão, truncar.
            example: https://receptora.com.br/open-banking/landing-page
          platform:
            type: string
            enum:
              - BROWSER
              - APP
            description: Identifica a plataforma utilizada
            example: BROWSER
          osVersion:
            type: string
            description: Versão do Sistema Operacional utilizado
            example: '20.04'
          os:
            type: string
            description: Sistema Operacional utilizado
            enum:
              - LINUX
              - MACOS
              - UNIX
              - IOS
              - ANDROID
              - OTHER
              - WINDOWS
            example: LINUX
          type:
            type: string
            enum:
              - AUTHORISED
              - REJECTED
            description: Tipo do fluxo de Hybridflow
          timestamp:
            type: string
            description: >-
              Data/Hora UTC no formato ISO8601 com milissegundos
              (YYYY-MM-DDTHH:mm:ss.sssZ) do momento em que a chamada foi
              disparada, imediatamente antes do primeiro byte enviado na
              requisição.
            maxLength: 28
            format: date-time
            pattern: >-
              ^\d{4}-\d{2}-\d{2}T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|[+-][01]\d:[0-5]\d)$
            example: '2021-11-11T18:08:08.278Z'
          serverOrgId:
            description: >-
              A ser enviado vazio caso o report seja da mesma instituição que
              obteve o token para uso da PCM e, caso contrário, deve ser
              preenchido com o organasationId da instituição filha para o qual a
              instituição mãe está fazendo o report.
            type: string
            format: uuid
            maxLength: 36
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            example: c1ca8e62-9d6f-4ea3-84f2-d66bc0a8f7dc
    HybridFlowReportResponse:
      additionalProperties: false
      required:
        - reportId
      type: array
      items:
        type: object
        properties:
          reportId:
            description: Identificador único interno do reporte no formato UUID v4.
            type: string
            format: uuid
            maxLength: 36
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            example: 9a97c2df-b261-4fc2-aa66-d1b5168397da
      description: >-
        Representa os dados que serão retornados pelas operações de inclusão de
        reportes.
    GenericError:
      description: Representa uma resposta de erro genérica.
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          pattern: ^[- /:_.',0-9a-zA-Z]{0,200}$
          maxLength: 200
    SecurityResponse:
      type: object
      properties:
        statusCode:
          type: integer
          description: Status de retorno HTTP da solicitação.
          minimum: 200
          maximum: 599
          example: 200
        access_token:
          type: string
        expires_in:
          type: integer
        refresh_expires_in:
          type: string
        token_type:
          type: string
        not-before-policy:
          type: integer
        scope:
          type: string
      required:
        - statusCode
        - access_token
        - expires_in
        - refresh_expires_in
        - token_type
        - not-before-policy
        - scope
    PaymentStatusRequest:
      type: object
      properties:
        eventDateTime:
          type: string
          description: >-
            Data e hora associados à mudança de estados finais reportados, como
            liquidação, rejeição ou cancelamento. Deve ser informado em UTC-0.
          format: date-time
          maxLength: 28
          example: '2025-08-18T00:00:00Z'
        consentId:
          type: string
          description: Identificador único do consentimento criado para aquele pagamento.
          maxLength: 100
          pattern: ^[- /:_.',0-9a-zA-Z]{0,100}$
          example: uGQHwNupARo7I9E2PLJZph18a0M9y7DcUe7ITt3DqUOJd9NVjnskxf2
        clientOrgId:
          type: string
          description: >-
            Identificador da organização cliente que realizou ou solicitou o
            pagamento.
          maxLength: 36
          format: uuid
          example: d78fc4e5-37ca-4da3-adf2-9b082bf92280
        paymentId:
          type: string
          description: Código único para identificar a transação de pagamento.
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9\-]{0,99}$
          example: d78fc4e5-37ca-4da3-adf2-9b082bf92280
        paymentStatus:
          type: string
          description: Status de agendamento ou final do pagamento
          enum:
            - ACSC
            - RJCT
            - CANC
            - SCHD
          example: ACSC
        paymentType:
          type: string
          description: Tipo do pagamento realizado.
          enum:
            - IMMEDIATE
            - RECURRENT
            - SWEEPING
            - SCHEDULED
            - WITHDRAW
            - CHANGE
          example: RECURRENT
        statusReasonCode:
          type: string
          description: >-
            Campo atrelado ao status do pagamento. Quando o status for RJCT
            (Rejected), o valor deve ser preenchido com o motivo da rejeição
            (valores previstos em rejectionReason.Code). Quando o status for
            CANC (Cancelled), o valor deve ser preenchido com motivo do
            cancelamento (valores previstos em cancellationReason.Code).
      required:
        - eventDateTime
        - consentId
        - paymentId
        - paymentStatus
        - paymentType
        - clientOrgId
    PaymentStatusGetResponse:
      allOf:
        - $ref: '#/components/schemas/PaymentStatusRequest'
        - type: object
          properties:
            reportId:
              type: string
              description: >-
                Identificador único do registro criado na Plataforma de Coleta
                de Métricas.
            createdAt:
              type: string
              format: date-time
              description: Carimbo do tempo do momento da criação do registro
            status:
              type: string
              enum:
                - ACCEPTED
                - DISCARDED
              description: >-
                Informa o status do registro de reporte.


                DISCARDED: O status DISCARDED indica que o reporte enviado pelo
                participante foi rejeitado pela PCM. O motivo do descarte será
                enviado com a resposta, podendo ser por conta de um reporte
                inválido ou por um erro no processamento. Não é possível
                modificar um reporte DISCARDED, portanto o reportador deverá
                corrigir o registro que apresentou erro e reenviar via POST.

                SINGLE: O status SINGLE indica que o reporte em questão não tem
                uma contraparte. Ele é utilizado em casos onde a conciliação
                entre dois reportes não é possível.

                ACCEPTED: O status ACCEPTED indica que a validação de formato do
                reporte não tem erros e este será enviado para processamento.

                UNPAIRED: O status UNPAIRED significa que o reporte atual não
                possui uma correspondência em outro reporte através do atributo
                fapiInteractionId. Indica um reporte divergente.

                PAIRED_INCONSISTENT: O status PAIRED_INCONSISTENT significa que
                o reporte corrente possui uma contraparte com o mesmo
                fapiInteractionId, mas os demais dados estão inconsistentes.
                Indica um reporte divergente.

                PAIRED: Indica que o reporte tem uma contraparte com o mesmo
                fapiInteractionId e os demais dados estão conciliados.
                Representa o estado final desejado em um fluxo correto.
              example: ACCEPTED
          required:
            - reportId
            - createdAt
            - status
    PaymentStatusResponse:
      type: object
      properties:
        reportId:
          type: string
        paymentId:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9\-]{0,99}$
        status:
          type: string
        message:
          type: string
      required:
        - reportId
        - paymentId
        - status
