            PAYMENT_ISSUE: Indica que a Instituição Credora encontrou alguma
            inconsistência na liquidação efetuada e que a Instituição Proponente
            deverá realizar ajustes conforme sugerido pela Instituição Credora
            para solucionar a pendência antes do cancelamento do pedido de
            portabilidade de crédito
          enum:
            - PENDING
            - RECEIVED
            - ACCEPTED_SETTLEMENT_IN_PROGRESS
            - ACCEPTED_SETTLEMENT_COMPLETED
            - PORTABILITY_COMPLETED
            - REJECTED
            - CANCELLED
          example: RECEIVED
        createdAt:
          type: string
          format: date-time
          maxLength: 28
          description: Carimbo do tempo do momento da criação do registro
        updatedAt:
          type: string
          format: date-time
          maxLength: 28
          description: Carimbo do tempo do momento da última atualização do registro
        status:
          type: string
          description: >-
            Informa o status do registro de reporte.


            DISCARDED: O status DISCARDED indica que o reporte enviado pelo
            participante foi rejeitado pela PCM. O motivo do descarte será
            enviado com a resposta, podendo ser por conta de um reporte inválido
            ou por um erro no processamento. Não é possível modificar um reporte
            DISCARDED, portanto o reportador deverá corrigir o registro que
            apresentou erro e reenviar via POST.

            SINGLE: O status SINGLE indica que o reporte em questão não tem uma
            contraparte. Ele é utilizado em casos onde a conciliação entre dois
            reportes não é possível.

            ACCEPTED: O status ACCEPTED indica que a validação de formato do
            reporte não tem erros e este será enviado para processamento.

            UNPAIRED: O status UNPAIRED significa que o reporte atual não possui
            uma correspondência em outro reporte através do atributo
            fapiInteractionId. Indica um reporte divergente.

            PAIRED_INCONSISTENT: O status PAIRED_INCONSISTENT significa que o
            reporte corrente possui uma contraparte com o mesmo
            fapiInteractionId, mas os demais dados estão inconsistentes. Indica
            um reporte divergente.

            PAIRED: Indica que o reporte tem uma contraparte com o mesmo
            fapiInteractionId e os demais dados estão conciliados. Representa o
            estado final desejado em um fluxo correto.
    HybridFlowClientRedirectToServerReportRequest:
      description: ''
      type: array
      minItems: 0
      maxItems: 1000
      items:
        type: object
        required:
          - consentId
          - platform
          - osVersion
          - os
          - timestamp
          - clientOrgId
        properties:
          consentId:
            type: string
            pattern: >-
              ^urn:[a-zA-Z0-9][a-zA-Z0-9\-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*''%\/?#]+$
            maxLength: 256
            description: >-
              O consentId deve ser preenchido com a mesma string do
              identificador único de um fluxo de consentimento de dados, de
              pagamento ou de vínculo
            example: urn:bancoex:C1DD33123
          uriAuthorizationEndpoint:
            type: string
            pattern: ^[- /:_.',0-9a-zA-Z]{0,200}$
            maxLength: 200
            description: >-
              Endpoint utilizado para o redirecionamento do usuário conforme
              cadastrado pela transmissora/detentora no arquivo
              .well-known/openid-configuration sem qualquer parâmetro
              introduzido pelo sistema da receptora/iniciadora. Caso a URI tenha
              mais de 200 caracteres de extensão, truncar.
            example: https://auth.banco.com.br/open-banking/Auth
          platform:
            type: string
            enum:
              - BROWSER
              - APP
            description: Identifica a plataforma utilizada
            example: BROWSER
          osVersion:
            type: string
            description: Sistema Operacional utilizado
            example: '20.04'
          os:
            type: string
            description: Versão do Sistema Operacional utilizado
            enum:
              - LINUX
              - MACOS
              - UNIX
              - IOS
              - ANDROID
              - OTHER
              - WINDOWS
            example: LINUX
          timestamp:
            type: string
            description: >-
              Data/Hora UTC no formato ISO8601 com milissegundos
              (YYYY-MM-DDTHH:mm:ss.sssZ) do momento em que a chamada foi
              disparada, imediatamente antes do primeiro byte enviado na
              requisição.
            maxLength: 28
            format: date-time
            pattern: >-
              ^\d{4}-\d{2}-\d{2}T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|[+-][01]\d:[0-5]\d)$
            example: '2021-11-11T18:08:08.278Z'
          clientOrgId:
            description: >-
              A ser enviado vazio caso o report seja da mesma instituição que
              obteve o token para uso da PCM e, caso contrário, deve ser
              preenchido com o organasationId da instituição filha para o qual a
              instituição mãe está fazendo o report.
            type: string
            format: uuid
            maxLength: 36
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            example: 56411f7e-d58b-44a8-8a2b-ff326d3f2955
